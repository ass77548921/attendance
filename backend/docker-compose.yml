name: attendance

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-noreply@attendance.local}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    command:
      - "java"
      - "-jar"
      - "/app/app.jar"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --server-response http://localhost:8080/ 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads_data:
