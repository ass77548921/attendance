name: Deploy to Staging (dev branch)

on:
  push:
    branches: [dev]

jobs:
  # ── 偵測哪些子專案有異動 ──────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      flutter: ${{ steps.filter.outputs.flutter }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            flutter:
              - 'flutter/**'
            frontend:
              - 'frontend/**'

  # ── Backend：test → deploy staging ───────────────────────
  deploy-backend-staging:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Run backend tests
        run: ./gradlew test
        working-directory: backend
      - name: Deploy backend to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /srv/attendance
            git fetch origin
            git checkout dev
            git reset --hard origin/dev
            docker compose -f backend/docker-compose.yml up -d --build app
            docker image prune -f

  # ── Flutter Web：deploy staging ───────────────────────────
  deploy-flutter-staging:
    needs: detect-changes
    if: needs.detect-changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Flutter Web to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /srv/attendance
            git fetch origin
            git checkout dev
            git reset --hard origin/dev
            docker compose -f flutter/docker-compose.yml up -d --build flutter-web
            docker image prune -f

  # ── Frontend：deploy staging ──────────────────────────────
  deploy-frontend-staging:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy frontend to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /srv/attendance
            git fetch origin
            git checkout dev
            git reset --hard origin/dev
            docker compose -f frontend/docker-compose.yml up -d --build frontend
            docker image prune -f
