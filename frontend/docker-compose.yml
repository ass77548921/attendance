name: attendance-frontend

services:
  frontend:
    image: node:20-alpine
    container_name: attendance-frontend
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://host.docker.internal:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
